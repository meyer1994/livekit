services:
  livekit:
    image: livekit/livekit-server:latest
    entrypoint: ["/bin/sh", "-c"]
    command: ["exec /livekit-server --dev --bind 0.0.0.0 2>&1"]
    ports:
      - "7880:7880"
      - "7881:7881/tcp"
      - "7882:7882/udp"

  agent:
    build:
      context: ./agent
    env_file:
      - .env
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY before starting the agent}
    depends_on:
      - livekit

  app:
    build:
      context: ./app
    environment:
      NUXT_LIVEKIT_API_KEY: devkey
      NUXT_LIVEKIT_API_SECRET: secret
      NUXT_PUBLIC_LIVEKIT_URL: ws://localhost:7880
    ports:
      - 3000:3000
    depends_on:
      - agent
