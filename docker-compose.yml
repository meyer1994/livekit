services:
  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"
      - "7881:7881/tcp"
      - "7882:7882/udp"

  agent:
    build:
      context: ./agent
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY before starting the agent}
    depends_on:
      - livekit
    restart: unless-stopped
