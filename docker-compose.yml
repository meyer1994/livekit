services:
  livekit:
    image: livekit/livekit-server:latest
    entrypoint: ["/bin/sh", "-c"]
    command: ["exec /livekit-server --dev --bind 0.0.0.0 2>&1"]
    ports:
      - "7880:7880"
      - "7881:7881/tcp"
      - "7882:7882/udp"

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"  # UI and OTLP HTTP collector
      - "4317:4317"  # OTLP gRPC collector

  agent:
    build:
      context: ./agent
    env_file:
      - ./agent/.env
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY before starting the agent}
      # The agent uses the OTLP/HTTP exporter, so use Phoenix's HTTP port.
      # OTEL_EXPORTER_OTLP_ENDPOINT gets /v1/traces appended automatically.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://phoenix:6006
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: livekit-agent
      OTEL_BSP_SCHEDULE_DELAY: 1000
    depends_on:
      - livekit
      - phoenix

  app:
    build:
      context: ./app
    environment:
      NUXT_LIVEKIT_API_KEY: devkey
      NUXT_LIVEKIT_API_SECRET: secret
      NUXT_PUBLIC_LIVEKIT_URL: ws://localhost:7880
    ports:
      - 3000:3000
    depends_on:
      - agent
