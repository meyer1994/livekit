<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LiveKit local room</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #101114;
        color: #f5f7fb;
      }

      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; }
      main { width: min(1100px, calc(100% - 32px)); margin: 0 auto; padding: 40px 0; }
      h1 { margin: 0 0 8px; font-size: 2rem; }
      p { color: #aeb4c0; }
      .panel { background: #191b21; border: 1px solid #2d3039; border-radius: 12px; padding: 20px; }
      .connection-form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .field { display: grid; gap: 6px; }
      .field.full { grid-column: 1 / -1; }
      label { color: #c9ced8; font-size: 0.9rem; }
      input, textarea, button {
        border: 1px solid #3a3e49;
        border-radius: 7px;
        background: #111318;
        color: inherit;
        font: inherit;
        padding: 10px 12px;
      }
      textarea { min-height: 90px; resize: vertical; font-family: ui-monospace, monospace; font-size: 0.8rem; }
      button { cursor: pointer; background: #3949ab; border-color: #5263c8; }
      button:hover { background: #4a5bc2; }
      button.secondary { background: #272a32; border-color: #444956; }
      button:disabled { cursor: not-allowed; opacity: 0.5; }
      .actions { display: flex; align-items: center; gap: 8px; grid-column: 1 / -1; }
      #status { color: #9da5b5; margin-left: 8px; }
      #status.connected { color: #73d69b; }
      .room-panel { display: none; margin-top: 20px; }
      .room-panel.visible { display: block; }
      .room-header { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 16px; }
      .room-header h2 { margin: 0; font-size: 1.1rem; }
      .controls { display: flex; gap: 8px; flex-wrap: wrap; }
      .track-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
      .track { position: relative; min-height: 180px; display: grid; place-items: center; overflow: hidden; border-radius: 8px; background: #0c0d10; border: 1px solid #2d3039; }
      .track video { width: 100%; height: 100%; min-height: 180px; object-fit: cover; }
      .track audio { width: 90%; }
      .track .name { position: absolute; bottom: 8px; left: 8px; padding: 4px 7px; border-radius: 5px; background: #0009; font-size: 0.8rem; }
      .log { margin-top: 20px; max-height: 180px; overflow: auto; padding: 12px; border-radius: 8px; background: #0c0d10; color: #aeb4c0; font: 0.8rem/1.5 ui-monospace, monospace; white-space: pre-wrap; }
      .hint { font-size: 0.85rem; margin-top: 12px; }
      @media (max-width: 700px) { .connection-form { grid-template-columns: 1fr; } .field.full, .actions { grid-column: auto; } }
    </style>
  </head>
  <body>
    <main>
      <h1>LiveKit local room</h1>
      <p>Connect to a LiveKit room, publish your camera and microphone, and receive the agent greeting.</p>

      <section class="panel">
        <form id="connection-form" class="connection-form">
          <div class="field">
            <label for="server-url">LiveKit URL</label>
            <input id="server-url" value="ws://localhost:7880" required />
          </div>
          <div class="field">
            <label for="room-name">Room name</label>
            <input id="room-name" value="demo-room" required />
          </div>
          <div class="field full">
            <label for="token">Participant token</label>
            <textarea id="token" placeholder="Paste a token generated by your backend or the LiveKit CLI" required></textarea>
          </div>
          <div class="actions">
            <button id="connect" type="submit">Connect</button>
            <button id="disconnect" class="secondary" type="button" disabled>Disconnect</button>
            <span id="status">Disconnected</span>
          </div>
        </form>
        <p class="hint">For local development, generate a token with the command in the README. Never put an API secret in a production browser application.</p>
      </section>

      <section id="room-panel" class="panel room-panel">
        <div class="room-header">
          <h2>Room: <span id="room-label"></span></h2>
          <div class="controls">
            <button id="microphone" class="secondary" type="button">Enable microphone</button>
            <button id="camera" class="secondary" type="button">Enable camera</button>
          </div>
        </div>
        <div id="track-grid" class="track-grid"></div>
        <div id="log" class="log" aria-live="polite"></div>
      </section>
    </main>

    <!-- Official LiveKit browser client. The UI below is plain HTML/CSS/JS. -->
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
    <script>
      const { Room, RoomEvent } = LivekitClient;
      let room = null;
      let microphoneEnabled = false;
      let cameraEnabled = false;

      const form = document.querySelector("#connection-form");
      const serverUrl = document.querySelector("#server-url");
      const roomName = document.querySelector("#room-name");
      const token = document.querySelector("#token");
      const connectButton = document.querySelector("#connect");
      const disconnectButton = document.querySelector("#disconnect");
      const status = document.querySelector("#status");
      const roomPanel = document.querySelector("#room-panel");
      const roomLabel = document.querySelector("#room-label");
      const trackGrid = document.querySelector("#track-grid");
      const logOutput = document.querySelector("#log");
      const microphoneButton = document.querySelector("#microphone");
      const cameraButton = document.querySelector("#camera");

      function log(message) {
        const line = document.createElement("div");
        line.textContent = `${new Date().toLocaleTimeString()}  ${message}`;
        logOutput.append(line);
        logOutput.scrollTop = logOutput.scrollHeight;
      }

      function setConnected(connected) {
        connectButton.disabled = connected;
        disconnectButton.disabled = !connected;
        roomPanel.classList.toggle("visible", connected);
        status.classList.toggle("connected", connected);
        status.textContent = connected ? "Connected" : "Disconnected";
      }

      function attachTrack(track, participant) {
        const wrapper = document.createElement("div");
        wrapper.className = "track";
        wrapper.dataset.trackSid = track.sid;

        const element = track.attach();
        wrapper.append(element);

        const name = document.createElement("span");
        name.className = "name";
        name.textContent = participant.identity;
        wrapper.append(name);
        trackGrid.append(wrapper);
      }

      function removeTrack(track) {
        track.detach().forEach((element) => element.remove());
        trackGrid.querySelector(`[data-track-sid="${track.sid}"]`)?.remove();
      }

      function bindRoomEvents() {
        room.on(RoomEvent.TrackSubscribed, (track, publication, participant) => {
          attachTrack(track, participant);
          log(`Subscribed to ${participant.identity}'s ${track.kind} track`);
        });

        room.on(RoomEvent.TrackUnsubscribed, (track) => removeTrack(track));

        room.on(RoomEvent.LocalTrackPublished, (publication) => {
          if (publication.track) attachTrack(publication.track, room.localParticipant);
        });

        room.on(RoomEvent.LocalTrackUnpublished, (publication) => {
          if (publication.track) removeTrack(publication.track);
        });

        room.on(RoomEvent.ParticipantConnected, (participant) => {
          log(`${participant.identity} joined`);
        });

        room.on(RoomEvent.ParticipantDisconnected, (participant) => {
          log(`${participant.identity} left`);
        });

        room.on(RoomEvent.DataReceived, (payload, participant, kind, topic) => {
          const message = new TextDecoder().decode(payload);
          log(`${participant?.identity || "room"}${topic ? ` [${topic}]` : ""}: ${message}`);
        });

        room.on(RoomEvent.Disconnected, () => {
          setConnected(false);
          log("Disconnected from LiveKit");
        });
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        try {
          room = new Room({ adaptiveStream: true, dynacast: true });
          bindRoomEvents();
          await room.connect(serverUrl.value.trim(), token.value.trim(), { autoSubscribe: true });
          roomLabel.textContent = room.name || roomName.value.trim();
          setConnected(true);
          log(`Connected as ${room.localParticipant.identity}`);
        } catch (error) {
          room?.disconnect();
          room = null;
          setConnected(false);
          log(`Connection failed: ${error.message}`);
        }
      });

      disconnectButton.addEventListener("click", () => {
        room?.disconnect();
        room = null;
        trackGrid.replaceChildren();
        microphoneEnabled = false;
        cameraEnabled = false;
        microphoneButton.textContent = "Enable microphone";
        cameraButton.textContent = "Enable camera";
        setConnected(false);
      });

      microphoneButton.addEventListener("click", async () => {
        if (!room) return;
        microphoneEnabled = !microphoneEnabled;
        await room.localParticipant.setMicrophoneEnabled(microphoneEnabled);
        microphoneButton.textContent = microphoneEnabled ? "Disable microphone" : "Enable microphone";
      });

      cameraButton.addEventListener("click", async () => {
        if (!room) return;
        cameraEnabled = !cameraEnabled;
        await room.localParticipant.setCameraEnabled(cameraEnabled);
        cameraButton.textContent = cameraEnabled ? "Disable camera" : "Enable camera";
      });
    </script>
  </body>
</html>
